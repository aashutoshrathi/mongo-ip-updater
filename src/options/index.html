<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body class="vflex">
    <div class="header hflex align-center">
      <div class="icon-container">
        <img class="icon" src="../../icons/icon.png" alt="" />
      </div>
      <div class="vflex f-1 ml-6">
        <p class="heading">MONGO IP UPDATER</p>
        <div class="hflex space-between">
          <span id="version"></span>
          <i class="lazy">&nbsp;&nbsp;&nbsp;for the supa hackas</i>
        </div>
      </div>
    </div>
    <div>
      <div class="vflex">
        <label for="ip">Your IP address</label>
        <input name="ip" id="ip" type="text" />
      </div>

      <div class="vflex">
        <label for="name">Name for entry</label>
        <input name="name" type="text" />
      </div>

      <button class="btn submit" id="upsert" type="button">
        Add or update access list
      </button>
    </div>
    <div class="tip">
      💡 Tip: This can be done from any page on <b>MongoDB Cloud</b>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="./index.js"></script>
  </body>
</html>
